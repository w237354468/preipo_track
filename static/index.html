<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKX 资产与合约持仓实时监控</title>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css?v=20260619_1">
</head>
<body>
    <div id="app" v-cloak>
        <n-config-provider :theme="darkTheme">
            <n-message-provider>
                <dashboard-app></dashboard-app>
            </n-message-provider>
        </n-config-provider>
    </div>

    <!-- Template for Dashboard App -->
    <script type="text/x-template" id="dashboard-template">
        <div class="main-content">
            
            <!-- Setup Section (Credentials Form) -->
            <n-card v-if="!showDashboard" class="login-card">
                <div class="login-header">
                    <i class="fa-solid fa-shield-halved login-logo"></i>
                    <h2>OKX 实时监控配置</h2>
                    <p>请输入您的 OKX 账号 API 密钥以查看实时账户余额与合约持仓</p>
                </div>
                
                <n-form @submit.prevent="handleConnectForm" label-placement="top">
                    <n-form-item label="API Key">
                        <template #label><span class="label-text"><i class="fa-solid fa-key"></i>API Key</span></template>
                        <n-input v-model:value="credentialsForm.api_key" placeholder="输入您的 OK-ACCESS-KEY" required />
                    </n-form-item>
                    
                    <n-form-item label="Secret Key">
                        <template #label><span class="label-text"><i class="fa-solid fa-lock"></i>Secret Key</span></template>
                        <n-input type="password" show-password-on="mousedown" v-model:value="credentialsForm.secret_key" placeholder="输入您的 OK-ACCESS-SIGN 秘钥" required />
                    </n-form-item>
                    
                    <n-form-item label="Passphrase (API 密码)">
                        <template #label><span class="label-text"><i class="fa-solid fa-key"></i>Passphrase (API 密码)</span></template>
                        <n-input type="password" show-password-on="mousedown" v-model:value="credentialsForm.passphrase" placeholder="输入创建 API 时的密码" required />
                    </n-form-item>
                    
                    <n-grid :cols="2" :x-gap="12">
                        <n-form-item-gi label="交易环境">
                            <template #label><span class="label-text"><i class="fa-solid fa-circle-nodes"></i>交易环境</span></template>
                            <n-select v-model:value="credentialsForm.environment" :options="envOptions" />
                        </n-form-item-gi>
                        
                        <n-form-item-gi class="remember-me-group">
                            <n-checkbox v-model:checked="rememberKeys">本地保存密钥 (安全加密)</n-checkbox>
                        </n-form-item-gi>
                    </n-grid>
                    
                    <n-button type="primary" attr-type="submit" :loading="connecting" block size="large" class="connect-button">
                        {{ connecting ? '正在建立 WebSocket 连接...' : '立即连接并开始监控' }}
                    </n-button>
                </n-form>
                
                <n-alert type="warning" show-icon class="security-alert">
                    <strong>安全说明</strong>：您的密钥将仅保存在您本地浏览器的 LocalStorage 中，每次查询均以加密流形式传输给本地后端，不会保存在任何云端服务器中。
                </n-alert>
            </n-card>
            
            <!-- Dashboard Section (Connected state) -->
            <div v-else id="dashboard-panel" class="dashboard-container">
                <!-- Header -->
                <header class="dashboard-header">
                    <div class="header-left">
                        <i class="fa-solid fa-chart-pie dashboard-logo-icon"></i>
                        <div>
                            <h1 style="font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 6px;">OKX 资产与合约持仓实时监控</h1>
                            <div class="connection-status-bar">
                                <div class="status-indicator online"></div>
                                <span style="color: var(--text-secondary);">{{ statusText }}</span>
                                <span class="refresh-countdown">
                                    <i class="fa-solid fa-bolt" style="color:var(--warning-yellow); margin-right:4px;"></i> WebSocket 实时推送中
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="header-right">
                        <n-space size="small">
                            <n-button type="tertiary" @click="openPasswordModal" size="medium">
                                <template #icon><i class="fa-solid fa-key"></i></template>
                                修改密码
                            </n-button>
                            <n-button type="tertiary" @click="forceReconnect" size="medium">
                                <template #icon><i class="fa-solid fa-rotate"></i></template>
                                刷新价格
                            </n-button>
                            <n-button type="error" @click="handleDisconnect" size="medium">
                                <template #icon><i class="fa-solid fa-power-off"></i></template>
                                断开连接
                            </n-button>
                        </n-space>
                    </div>
                </header>

                <!-- Segmented Tabs for different bot views -->
                <n-tabs type="segment" class="dashboard-tabs" style="margin-top: 15px;">
                    <!-- Tab 1: Grid Trading & Assets -->
                    <n-tab-pane name="grids" tab="网格监控 & 资金明细">
                        <!-- Stats Summary Row -->
                        <n-grid :cols="3" :x-gap="20" style="margin-bottom: 30px; margin-top: 15px;">
                            <n-grid-item>
                                <n-card class="stat-card">
                                    <div class="stat-card-inner">
                                        <div class="stat-info">
                                            <span class="stat-label"><i class="fa-solid fa-circle-dot stat-dot blue"></i>交易账户总资产估值</span>
                                            <h2 id="total-equity" class="stat-value">$ {{ formatUSD(totalEquityUsd) }}</h2>
                                        </div>
                                        <div class="stat-icon-wrapper blue">
                                            <i class="fa-solid fa-wallet"></i>
                                        </div>
                                    </div>
                                </n-card>
                            </n-grid-item>
                            <n-grid-item>
                                <n-card class="stat-card">
                                    <div class="stat-card-inner">
                                        <div class="stat-info">
                                            <span class="stat-label"><i class="fa-solid fa-circle-dot stat-dot" :class="isSimulated ? 'yellow' : 'green'"></i>运行环境</span>
                                            <h2 id="env-badge" class="stat-value" :class="isSimulated ? 'yellow-text' : 'green-text'">
                                                {{ isSimulated ? '模拟盘 (DEMO)' : '实盘交易 (LIVE)' }}
                                            </h2>
                                        </div>
                                        <div class="stat-icon-wrapper" :class="isSimulated ? 'yellow' : 'green'">
                                            <i class="fa-solid fa-server"></i>
                                        </div>
                                    </div>
                                </n-card>
                            </n-grid-item>
                            <n-grid-item>
                                <n-card class="stat-card">
                                    <div class="stat-card-inner">
                                        <div class="stat-info">
                                            <span class="stat-label"><i class="fa-solid fa-circle-dot stat-dot purple"></i>持仓仓位数量</span>
                                            <h2 id="positions-count" class="stat-value">{{ positions.length }} <span class="stat-unit">个仓位</span></h2>
                                        </div>
                                        <div class="stat-icon-wrapper purple">
                                            <i class="fa-solid fa-layer-group"></i>
                                        </div>
                                    </div>
                                </n-card>
                            </n-grid-item>
                        </n-grid>

                        <!-- Main Data Tables -->
                        <div class="tables-layout" style="display: flex; flex-direction: column; gap: 24px;">
                            <!-- Positions Table -->
                            <n-card title="合约当前持有仓位" style="background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 16px;">
                                <template #header-extra><i class="fa-solid fa-circle-nodes" style="color: var(--accent-blue); font-size: 16px;"></i></template>
                                <div class="table-scroll-container" style="overflow-x: auto;">
                                    <n-table :bordered="false" :single-line="false" class="data-table">
                                        <thead>
                                            <tr>
                                                <th>合约名称</th>
                                                <th>方向</th>
                                                <th>杠杆</th>
                                                <th>持仓量</th>
                                                <th>开仓均价</th>
                                                <th>最新价格</th>
                                                <th style="width: 110px; text-align: center;">5分钟趋势</th>
                                                <th>未实现盈亏</th>
                                                <th>收益率</th>
                                                <th>强平价</th>
                                                <th>保证金</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-if="positions.length === 0">
                                                <td colspan="11" class="placeholder-text" style="text-align: center; color: var(--text-muted); font-style: italic; padding: 30px 0;">当前没有活跃的合约持仓</td>
                                            </tr>
                                            <tr v-for="(p, idx) in positions" :key="p.instId + '_' + p.posSide">
                                                <td><strong>{{ p.instId }}</strong></td>
                                                <td>
                                                    <n-tag :type="p.posSide === 'long' ? 'success' : 'error'" size="small" style="font-weight:600;">
                                                        {{ p.posSide === 'long' ? '多单 LONG' : '空单 SHORT' }}
                                                    </n-tag>
                                                </td>
                                                <td class="crypto-numeric">{{ p.lever }}x</td>
                                                <td class="crypto-numeric">{{ formatNumber(p.pos) }}</td>
                                                <td class="crypto-numeric">$ {{ formatNumber(p.avgPx) }}</td>
                                                <td class="crypto-numeric">$ {{ formatNumber(p.cPx) }}</td>
                                                <td style="text-align: center; vertical-align: middle;">
                                                    <canvas class="sparkline-canvas" :id="'sparkline-pos-' + idx" width="100" height="30"></canvas>
                                                </td>
                                                <td :class="['crypto-numeric', 'pnl-cell', p.upl >= 0 ? 'positive' : 'negative']">
                                                    {{ p.upl >= 0 ? '+' : '' }}{{ formatUSD(p.upl) }}
                                                </td>
                                                <td :class="['crypto-numeric', 'pnl-cell', p.uplRatio >= 0 ? 'positive' : 'negative']">
                                                    {{ p.uplRatio >= 0 ? '+' : '' }}{{ p.uplRatio.toFixed(2) }}%
                                                </td>
                                                <td class="crypto-numeric liq-price-cell" style="color: var(--warning-yellow);">{{ p.liqPx > 0 ? '$ ' + formatNumber(p.liqPx) : '--' }}</td>
                                                <td class="crypto-numeric">$ {{ formatUSD(p.margin) }}</td>
                                            </tr>
                                        </tbody>
                                    </n-table>
                                </div>
                            </n-card>
                            
                            <!-- Grid Strategies Table -->
                            <n-card title="运行中的网格策略单" style="background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 16px;">
                                <template #header-extra><i class="fa-solid fa-robot" style="color: var(--accent-blue); font-size: 16px;"></i></template>
                                <div class="table-scroll-container" style="overflow-x: auto;">
                                    <n-table :bordered="false" :single-line="false" class="data-table">
                                        <thead>
                                            <tr>
                                                <th>交易对 / 策略ID</th>
                                                <th>策略类型</th>
                                                <th>方向 / 杠杆</th>
                                                <th>价格区间</th>
                                                <th>网格数</th>
                                                <th>投入金额</th>
                                                <th>网格利润</th>
                                                <th>浮动盈亏</th>
                                                <th>总盈亏 / 收益率</th>
                                                <th>最新价格</th>
                                                <th style="width: 110px; text-align: center;">5分钟趋势</th>
                                                <th>状态</th>
                                                <th>创建时间</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-if="gridStrategies.length === 0">
                                                <td colspan="13" class="placeholder-text" style="text-align: center; color: var(--text-muted); font-style: italic; padding: 30px 0;">当前没有运行中的网格策略</td>
                                            </tr>
                                            <tr v-for="(g, idx) in gridStrategies" :key="g.algoId">
                                                <td><strong>{{ g.instId }}</strong><br><small style="color:var(--text-secondary);font-size:10px;">{{ g.algoId }}</small></td>
                                                <td><n-tag type="info" size="small">{{ g.algoOrdType === 'contract_grid' ? '合约网格' : '现货网格' }}</n-tag></td>
                                                <td>
                                                    <n-tag :type="g.direction === 'long' ? 'success' : g.direction === 'short' ? 'error' : 'default'" size="small">
                                                        {{ g.direction === 'long' ? '做多' : g.direction === 'short' ? '做空' : '中性' }}
                                                    </n-tag><br>
                                                    <small class="crypto-numeric" style="font-size:10px;">{{ g.lever ? g.lever + 'x' : '1x' }}</small>
                                                </td>
                                                <td class="crypto-numeric">{{ formatNumber(g.minPx) }} - {{ formatNumber(g.maxPx) }}</td>
                                                <td class="crypto-numeric">{{ g.gridNum || '--' }}</td>
                                                <td class="crypto-numeric">$ {{ formatUSD(parseFloat(g.investment || 0)) }}</td>
                                                <td class="crypto-numeric positive" style="color: var(--crypto-green);">{{ formatUSD(parseFloat(g.gridProfit || 0)) }}</td>
                                                <td :class="['crypto-numeric', 'pnl-cell', parseFloat(g.floatProfit || 0) >= 0 ? 'positive' : 'negative']">
                                                    {{ parseFloat(g.floatProfit || 0) >= 0 ? '+' : '' }}{{ formatUSD(parseFloat(g.floatProfit || 0)) }}
                                                </td>
                                                <td :class="['crypto-numeric', 'pnl-cell', parseFloat(g.totalPnl || 0) >= 0 ? 'positive' : 'negative']">
                                                    <strong>{{ parseFloat(g.totalPnl || 0) >= 0 ? '+' : '' }}{{ formatUSD(parseFloat(g.totalPnl || 0)) }}</strong><br>
                                                    <small>{{ parseFloat(g.pnlRatio || 0) >= 0 ? '+' : '' }}{{ (parseFloat(g.pnlRatio || 0) * 100).toFixed(2) }}%</small>
                                                </td>
                                                <td class="crypto-numeric last-price-cell">{{ g.lastPrice ? '$ ' + formatNumber(g.lastPrice) : '--' }}</td>
                                                <td style="text-align: center; vertical-align: middle;">
                                                    <canvas class="sparkline-canvas" :id="'sparkline-grid-' + idx" width="100" height="30"></canvas>
                                                </td>
                                                <td><n-tag type="success" size="small" round>{{ g.state === 'running' ? '运行中' : g.state }}</n-tag></td>
                                                <td><small style="color:var(--text-secondary);font-size:11px;">{{ formatDate(g.cTime) }}</small></td>
                                            </tr>
                                        </tbody>
                                    </n-table>
                                </div>
                            </n-card>

                            <!-- Assets Table -->
                            <n-card title="账户资产余额明细 (交易 & 资金)" style="background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 16px;">
                                <template #header-extra><i class="fa-solid fa-wallet" style="color: var(--accent-blue); font-size: 16px;"></i></template>
                                <div class="table-scroll-container" style="overflow-x: auto;">
                                    <n-table :bordered="false" :single-line="false" class="data-table">
                                        <thead>
                                            <tr>
                                                <th>币种</th>
                                                <th>总持有量</th>
                                                <th>交易账户余额</th>
                                                <th>资金账户余额</th>
                                                <th>交易账户可用</th>
                                                <th>资产估值 (USD)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr v-if="assets.length === 0">
                                                <td colspan="6" class="placeholder-text" style="text-align: center; color: var(--text-muted); font-style: italic; padding: 30px 0;">您的账户中没有任何资产存额</td>
                                            </tr>
                                            <tr v-for="a in assets" :key="a.ccy">
                                                <td><strong>{{ a.ccy }}</strong></td>
                                                <td class="crypto-numeric">{{ formatMaxDecimals(a.total_eq, 8) }}</td>
                                                <td class="crypto-numeric">{{ formatMaxDecimals(a.trading_eq, 8) }}</td>
                                                <td class="crypto-numeric">{{ formatMaxDecimals(a.funding_bal, 8) }}</td>
                                                <td class="crypto-numeric">{{ formatMaxDecimals(a.trading_avail, 8) }}</td>
                                                <td class="crypto-numeric">$ {{ a.valuation_usd > 0 ? formatUSD(a.valuation_usd) : '--' }}</td>
                                            </tr>
                                        </tbody>
                                    </n-table>
                                </div>
                            </n-card>
                        </div>
                    </n-tab-pane>

                    <!-- Tab 2: EMA+RSI Pullback Bot Status -->
                    <n-tab-pane name="ma_bot" tab="EMA+RSI 趋势回调实盘">
                        <!-- Row 1: Status Cards -->
                        <n-grid :cols="5" :x-gap="16" style="margin-bottom: 20px; margin-top: 15px;">
                            <n-grid-item>
                                <n-card size="small" class="stat-card" style="height: 100%;">
                                    <div class="stat-card-inner" style="padding: 16px;">
                                        <div class="stat-info">
                                            <span class="stat-label">运行状态</span>
                                            <n-tag :type="!maBotStatus.is_running ? 'error' : (maBotStatus.is_paused ? 'warning' : 'success')" size="medium" style="font-weight: 700; margin-top: 4px;">
                                                {{ !maBotStatus.is_running ? '已停止' : (maBotStatus.is_paused ? '已暂停' : '运行中') }}
                                            </n-tag>
                                            <n-button 
                                                v-if="maBotStatus.is_running" 
                                                size="tiny" 
                                                :type="maBotStatus.is_paused ? 'success' : 'warning'" 
                                                style="margin-top: 6px; font-weight: 600;" 
                                                @click="toggleMaBotPause"
                                            >
                                                {{ maBotStatus.is_paused ? '恢复策略' : '暂停策略' }}
                                            </n-button>
                                            <span style="margin-top: 4px; color: var(--text-muted); font-size: 9px; font-family: monospace;">
                                                {{ maBotStatus.last_time ? maBotStatus.last_time.split(' ')[1] : '--' }}
                                            </span>
                                        </div>
                                        <div class="stat-icon-wrapper" :class="!maBotStatus.is_running ? 'red' : (maBotStatus.is_paused ? 'yellow' : 'green')" style="width: 36px; height: 36px; font-size: 14px; border-radius: 8px;">
                                            <i class="fa-solid" :class="!maBotStatus.is_running ? 'fa-stop' : (maBotStatus.is_paused ? 'fa-pause' : 'fa-play')"></i>
                                        </div>
                                    </div>
                                </n-card>
                            </n-grid-item>
                            
                            <n-grid-item>
                                <n-card size="small" class="stat-card" style="height: 100%;">
                                    <div class="stat-card-inner" style="padding: 16px;">
                                        <div class="stat-info">
                                            <span class="stat-label">最新价格</span>
                                            <h3 class="crypto-numeric" style="color:#ffffff; font-size:16px; font-weight:700; margin-top: 4px;">$ {{ maBotStatus.price ? formatNumber(maBotStatus.price) : '--' }}</h3>
                                            <span style="color: var(--text-muted); font-size: 9px; margin-top: 2px;">AP-USDT-SWAP</span>
                                        </div>
                                        <div class="stat-icon-wrapper blue" style="width: 36px; height: 36px; font-size: 14px; border-radius: 8px;">
                                            <i class="fa-solid fa-dollar-sign"></i>
                                        </div>
                                    </div>
                                </n-card>
                            </n-grid-item>
                            
                            <n-grid-item>
                                <n-card size="small" class="stat-card" style="height: 100%;">
                                    <div class="stat-card-inner" style="padding: 16px;">
                                        <div class="stat-info">
                                            <span class="stat-label">指标 (30m)</span>
                                            <div style="font-size: 10px; font-weight:600; margin-top: 4px; color: var(--accent-blue);">
                                                EMA: {{ maBotStatus.fast_ma ? formatNumber(maBotStatus.fast_ma) : '--' }}
                                            </div>
                                            <div style="font-size: 10px; font-weight:600; margin-top: 2px; color: var(--accent-purple);">
                                                RSI: {{ maBotStatus.slow_ma ? formatNumber(maBotStatus.slow_ma) : '--' }}
                                            </div>
                                        </div>
                                        <div class="stat-icon-wrapper purple" style="width: 36px; height: 36px; font-size: 14px; border-radius: 8px;">
                                            <i class="fa-solid fa-chart-simple"></i>
                                        </div>
                                    </div>
                                </n-card>
                            </n-grid-item>
                            
                            <n-grid-item>
                                <n-card size="small" class="stat-card" style="height: 100%;">
                                    <div class="stat-card-inner" style="padding: 16px;">
                                        <div class="stat-info">
                                            <span class="stat-label">账户余额</span>
                                            <h3 class="crypto-numeric" style="color:#ffffff; font-size:16px; font-weight:700; margin-top: 4px;">$ {{ maBotStatus.balance ? formatUSD(maBotStatus.balance) : '0.00' }}</h3>
                                            <span style="color: var(--warning-yellow); font-size: 9px; margin-top: 2px;">3x · 10 USDT</span>
                                        </div>
                                        <div class="stat-icon-wrapper yellow" style="width: 36px; height: 36px; font-size: 14px; border-radius: 8px;">
                                            <i class="fa-solid fa-scale-balanced"></i>
                                        </div>
                                    </div>
                                </n-card>
                            </n-grid-item>
                            
                            <n-grid-item>
                                <n-card size="small" class="stat-card" style="height: 100%;">
                                    <div class="stat-card-inner" style="padding: 16px;">
                                        <div class="stat-info">
                                            <span class="stat-label">最新信号</span>
                                            <n-tag :type="(maBotStatus.last_signal === 'golden_cross' || maBotStatus.last_signal === 'long_entry') ? 'success' : (maBotStatus.last_signal === 'death_cross' || maBotStatus.last_signal === 'short_entry') ? 'error' : 'default'" size="medium" style="font-weight: 700; margin-top: 4px;">
                                                {{ (maBotStatus.last_signal === 'golden_cross' || maBotStatus.last_signal === 'long_entry') ? '做多 LONG' : (maBotStatus.last_signal === 'death_cross' || maBotStatus.last_signal === 'short_entry') ? '做空 SHORT' : maBotStatus.last_signal || '无信号' }}
                                            </n-tag>
                                        </div>
                                        <div class="stat-icon-wrapper blue" style="width: 36px; height: 36px; font-size: 14px; border-radius: 8px;">
                                            <i class="fa-solid fa-wave-square"></i>
                                        </div>
                                    </div>
                                </n-card>
                            </n-grid-item>
                        </n-grid>
                        
                        <!-- Row 2: Grid containing Position Cockpit and Strategy Signal Monitor -->
                        <n-grid :cols="24" :x-gap="20" style="margin-bottom: 20px;">
                            <n-grid-item :span="14">
                                <n-card title="当前持仓 (EMA+RSI 独立仓位)" style="height: 100%;">
                                    <template #header-extra><i class="fa-solid fa-crosshairs" style="color: var(--accent-blue); font-size: 16px;"></i></template>
                                    <div v-if="maBotStatus.position && maBotStatus.position.side !== 'flat'" class="cockpit-container" style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 15px; align-items: center;">
                                        <!-- Direction visual and metrics -->
                                        <div>
                                            <div style="display:flex; align-items:center; gap: 12px; margin-bottom: 12px;">
                                                <n-tag :type="maBotStatus.position.side === 'long' ? 'success' : 'error'" size="large" style="font-weight: 700;">
                                                    {{ maBotStatus.position.side === 'long' ? '做多 LONG' : '做空 SHORT' }}
                                                </n-tag>
                                                <span style="color: var(--text-secondary); font-size: 10px; font-family: monospace;">
                                                    3x | 数量: {{ maBotStatus.position.size }}
                                                </span>
                                            </div>
                                            <div class="cockpit-metrics" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                                                <div class="metric-box">
                                                    <span class="metric-label" style="font-size: 9px;">开仓价格</span>
                                                    <span class="metric-val crypto-numeric" style="font-size: 14px;">$ {{ formatNumber(maBotStatus.position.avgPx) }}</span>
                                                </div>
                                                <div class="metric-box">
                                                    <span class="metric-label" style="font-size: 9px;">当前价格</span>
                                                    <span class="metric-val crypto-numeric" style="font-size: 14px; color: var(--accent-blue);">$ {{ maBotStatus.price ? formatNumber(maBotStatus.price) : '--' }}</span>
                                                </div>
                                                <div class="metric-box">
                                                    <span class="metric-label" style="font-size: 9px;">未实现盈亏</span>
                                                    <span class="metric-val pnl-text crypto-numeric" style="font-size: 14px;" :style="{ color: maBotStatus.position.upl >= 0 ? 'var(--crypto-green)' : 'var(--crypto-red)' }">
                                                        {{ maBotStatus.position.upl >= 0 ? '+' : '' }}{{ formatUSD(maBotStatus.position.upl) }}
                                                    </span>
                                                </div>
                                                <div class="metric-box">
                                                    <span class="metric-label" style="font-size: 9px;">收益率</span>
                                                    <span class="metric-val pnl-text crypto-numeric" style="font-size: 14px;" :style="{ color: maBotStatus.position.uplRatio >= 0 ? 'var(--crypto-green)' : 'var(--crypto-red)' }">
                                                        {{ maBotStatus.position.uplRatio >= 0 ? '+' : '' }}{{ maBotStatus.position.uplRatio.toFixed ? maBotStatus.position.uplRatio.toFixed(2) : maBotStatus.position.uplRatio }}%
                                                    </span>
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <!-- Visual Risk Bar -->
                                        <div class="risk-bar-card" style="padding: 12px; height: 100%;">
                                            <div style="font-size: 10px; font-weight:600; color: var(--text-secondary); display:flex; align-items:center; gap:4px; margin-bottom: 4px;">
                                                <i class="fa-solid fa-shield-halved" style="color:var(--accent-blue);"></i> 止损/止盈风险监控
                                            </div>
                                            <div class="risk-bar-container" style="padding-bottom: 15px;">
                                                <div class="risk-bar-labels" style="font-size: 8.5px; margin-bottom: 4px;">
                                                    <span class="sl-label">${{ formatNumber(maBotStatus.position.stop_loss) }}</span>
                                                    <span class="tp-label">${{ formatNumber(maBotStatus.position.take_profit) }}</span>
                                                </div>
                                                <div class="risk-bar-track" style="height: 4px;">
                                                    <div class="risk-zone-loss" :style="{ width: getPositionEntryProgress(maBotStatus.position) + '%' }"></div>
                                                    <div class="risk-zone-profit" :style="{ left: getPositionEntryProgress(maBotStatus.position) + '%', width: (100 - getPositionEntryProgress(maBotStatus.position)) + '%' }"></div>
                                                    <div class="current-price-marker" :style="{ left: getPositionProgress(maBotStatus.position) + '%' }" style="top: -6px; width: 14px; height: 14px;">
                                                        <span class="marker-tooltip" style="bottom: -18px; font-size: 8px; padding: 1px 4px;">现价 ${{ formatNumber(maBotStatus.price) }}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div v-else style="text-align: center; color: var(--text-muted); padding: 30px 0; display:flex; flex-direction:column; align-items:center; gap:8px;">
                                        <i class="fa-solid fa-ghost" style="font-size: 28px; opacity: 0.3; animation: floatUpDown 2.5s infinite ease-in-out;"></i>
                                        <div style="font-size: 12px; font-weight:500;">当前无活跃仓位</div>
                                        <div style="font-size: 10px; color:var(--text-muted); max-width:350px; line-height:1.4;">
                                            等待 EMA+RSI 触发信号开仓。
                                        </div>
                                    </div>
                                </n-card>
                            </n-grid-item>

                            <!-- Column 2: Strategy Signal Monitor Card -->
                            <n-grid-item :span="10">
                                <n-card title="策略信号触发监控 (EMA+RSI)" style="height: 100%;">
                                    <template #header-extra><i class="fa-solid fa-compass" style="color: var(--accent-purple); font-size: 16px;"></i></template>
                                    <div style="display:flex; flex-direction:column; gap:12px;">
                                        
                                        <!-- Trend direction status -->
                                        <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.01); border: 1px solid rgba(255,255,255,0.02); padding: 8px 12px; border-radius: 8px;">
                                            <span style="font-size: 12px; color: var(--text-secondary);">① 趋势过滤 (EMA 200)</span>
                                            <n-tag v-if="maBotStatus.price && maBotStatus.fast_ma" :type="maBotStatus.price > maBotStatus.fast_ma ? 'success' : 'error'" size="small" style="font-weight:700;">
                                                {{ maBotStatus.price > maBotStatus.fast_ma ? '做多趋势 (LONG ONLY)' : '做空趋势 (SHORT ONLY)' }}
                                            </n-tag>
                                            <span v-else style="color:var(--text-muted); font-size:11px;">加载中...</span>
                                        </div>
                                        
                                        <!-- Price vs EMA 200 -->
                                        <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-secondary); padding: 0 4px;">
                                            <span>现价: <strong class="crypto-numeric" style="color:#fff;">${{ formatNumber(maBotStatus.price) }}</strong></span>
                                            <span>EMA(200): <strong class="crypto-numeric" style="color:#fff;">${{ formatNumber(maBotStatus.fast_ma) }}</strong></span>
                                        </div>

                                        <n-divider style="margin: 4px 0;" />

                                        <!-- RSI Pullback Entry Trigger status -->
                                        <div>
                                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 6px;">
                                                <span style="font-size: 12px; color: var(--text-secondary);">② 回调开仓触发 (RSI 14)</span>
                                                <n-tag v-if="maBotStatus.price && maBotStatus.fast_ma && maBotStatus.slow_ma" 
                                                       :type="((maBotStatus.price > maBotStatus.fast_ma && maBotStatus.slow_ma >= 35 && maBotStatus.slow_ma <= 45) || (maBotStatus.price < maBotStatus.fast_ma && maBotStatus.slow_ma >= 55 && maBotStatus.slow_ma <= 65)) ? 'success' : 'warning'"
                                                       size="small" style="font-weight:700;">
                                                    {{ ((maBotStatus.price > maBotStatus.fast_ma && maBotStatus.slow_ma >= 35 && maBotStatus.slow_ma <= 45) || (maBotStatus.price < maBotStatus.fast_ma && maBotStatus.slow_ma >= 55 && maBotStatus.slow_ma <= 65)) ? '满足开仓条件' : '等待回调区间' }}
                                                </n-tag>
                                                <span v-else style="color:var(--text-muted); font-size:11px;">加载中...</span>
                                            </div>
                                            
                                            <!-- Target vs Current RSI -->
                                            <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--text-secondary); padding: 0 4px; margin-bottom: 4px;">
                                                <span>目标 RSI: 
                                                    <strong style="color:var(--crypto-green);" v-if="maBotStatus.price > maBotStatus.fast_ma">35.0 - 45.0 (多单)</strong>
                                                    <strong style="color:var(--crypto-red);" v-else>55.0 - 65.0 (空单)</strong>
                                                </span>
                                                <span>当前 RSI(14): <strong class="crypto-numeric" style="color:#fff;">{{ maBotStatus.slow_ma ? maBotStatus.slow_ma.toFixed(2) : '--' }}</strong></span>
                                            </div>
                                        </div>

                                        <!-- If position is active, show exit condition monitors -->
                                        <div v-if="maBotStatus.position && maBotStatus.position.side !== 'flat'" style="background:rgba(255,23,68,0.02); border:1px dashed rgba(255,23,68,0.1); padding: 8px; border-radius: 8px; font-size: 11px; margin-top: 2px;">
                                            <div style="font-weight:600; color:var(--crypto-red); margin-bottom:4px;"><i class="fa-solid fa-bell"></i> 离场条件监测：</div>
                                            <div style="display:flex; justify-content:space-between; color:var(--text-secondary); margin-bottom:2px;">
                                                <span>RSI 极端平仓线:</span>
                                                <span style="color:#fff;">{{ maBotStatus.position.side === 'long' ? '> 75.0 (超买)' : '< 25.0 (超卖)' }}</span>
                                            </div>
                                            <div style="display:flex; justify-content:space-between; color:var(--text-secondary);">
                                                <span>趋势反向平仓线:</span>
                                                <span style="color:#fff;">价格 {{ maBotStatus.position.side === 'long' ? '<' : '>' }} EMA(200)</span>
                                            </div>
                                        </div>

                                    </div>
                                </n-card>
                            </n-grid-item>
                        </n-grid>
                        
                        <!-- Row 3: Trade History Table -->
                        <n-card title="交易记录" style="margin-bottom: 20px;">
                            <template #header-extra><i class="fa-solid fa-clock-rotate-left" style="color: var(--accent-blue); font-size: 16px;"></i></template>
                            <div class="table-scroll-container" style="overflow-x: auto;">
                                <n-table :bordered="false" :single-line="false" class="data-table">
                                    <thead>
                                        <tr>
                                            <th>时间 (UTC)</th>
                                            <th>操作</th>
                                            <th>数量</th>
                                            <th>执行价格</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-if="maBotTrades.length === 0">
                                            <td colspan="4" class="placeholder-text" style="text-align: center; color: var(--text-muted); font-style: italic; padding: 20px 0;">暂无交易记录</td>
                                        </tr>
                                        <tr v-for="(t, tIdx) in maBotTrades" :key="tIdx">
                                            <td><small style="color:var(--text-secondary);">{{ t.time }}</small></td>
                                            <td>
                                                <n-tag 
                                                    :type="t.action.includes('LONG') ? 'success' : 'error'" 
                                                    size="small" 
                                                    style="font-weight: 600;"
                                                >
                                                    {{ t.action === 'OPEN_LONG' ? '开多' : t.action === 'CLOSE_LONG' ? '平多' : t.action === 'OPEN_SHORT' ? '开空' : t.action === 'CLOSE_SHORT' ? '平空' : t.action }}
                                                </n-tag>
                                            </td>
                                            <td class="crypto-numeric">{{ t.size }}</td>
                                            <td class="crypto-numeric">$ {{ formatNumber(t.price) }}</td>
                                        </tr>
                                    </tbody>
                                </n-table>
                            </div>
                        </n-card>
                        
                        <!-- Row 4: Logs -->
                        <n-card title="策略实时运行日志">
                            <div style="display:flex; flex-direction:column; gap:16px;">
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <div style="color: var(--text-secondary); font-size:12px;">
                                        <i class="fa-solid fa-circle-info" style="color:var(--accent-blue); margin-right:6px;"></i>
                                        实盘后台进程每 3 秒刷新一次日志。此仓位独立执行交易逻辑，不影响其他手工或网格运行。
                                    </div>
                                    <n-button type="info" size="small" secondary @click="fetchMaBotInfo">
                                        <template #icon><i class="fa-solid fa-rotate"></i></template>
                                        手动刷新
                                    </n-button>
                                </div>
                                <div class="terminal-window">
                                    <div class="terminal-header">
                                        <div class="terminal-buttons">
                                            <div class="terminal-btn red"></div>
                                            <div class="terminal-btn yellow"></div>
                                            <div class="terminal-btn green"></div>
                                        </div>
                                        <div class="terminal-title">ema_rsi_pullback_bot.log - bash</div>
                                        <div class="terminal-placeholder"></div>
                                    </div>
                                    <div class="log-console-container">
                                        <div v-if="maBotLogs.length === 0" style="color: var(--text-muted); font-style: italic; text-align: center; padding: 40px 0;">
                                            暂无日志记录。等待机器人启动...
                                        </div>
                                        <div v-for="(log, lIdx) in maBotLogs" :key="lIdx" class="log-line" :class="{
                                            'error': log.includes('ERROR') || log.includes('ERR'),
                                            'warning': log.includes('WARNING') || log.includes('⚠️'),
                                            'signal': log.includes('golden_cross') || log.includes('death_cross') || log.includes('Signal'),
                                            'trade': log.includes('Order') || log.includes('Open') || log.includes('Close') || log.includes('response'),
                                            'info': !log.includes('ERROR') && !log.includes('WARNING') && !log.includes('⚠️') && !log.includes('golden_cross') && !log.includes('death_cross') && !log.includes('Signal') && !log.includes('Order') && !log.includes('Open') && !log.includes('Close')
                                        }">
                                            {{ log }}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </n-card>
                    </n-tab-pane>
                </n-tabs>
            </div>
            
            <!-- Change Password Modal via Naive UI Modal component -->
            <n-modal v-model:show="showPasswordModal" preset="card" style="width: 450px;" title="修改系统登录密码">
                <n-form @submit.prevent="handleChangePassword" label-placement="top">
                    <n-form-item label="当前密码">
                        <n-input type="password" show-password-on="mousedown" v-model:value="passwordForm.old" placeholder="输入当前密码" required />
                    </n-form-item>
                    <n-form-item label="新密码">
                        <n-input type="password" show-password-on="mousedown" v-model:value="passwordForm.new" placeholder="输入新密码 (至少6位)" required />
                    </n-form-item>
                    <n-form-item label="确认新密码">
                        <n-input type="password" show-password-on="mousedown" v-model:value="passwordForm.confirm" placeholder="再次输入新密码" required />
                    </n-form-item>
                    
                    <n-alert v-if="passwordForm.error" type="error" show-icon style="margin-bottom: 16px;">
                        {{ passwordForm.error }}
                    </n-alert>
                    <n-alert v-if="passwordForm.success" type="success" show-icon style="margin-bottom: 16px;">
                        {{ passwordForm.success }}
                    </n-alert>
                    
                    <n-button type="primary" attr-type="submit" :loading="passwordForm.submitting" block size="large" style="margin-top: 16px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); border: none; font-weight: 600;">
                        确认修改密码
                    </n-button>
                </n-form>
            </n-modal>
            
        </div>
    </script>
    
    <!-- Load Vue 3, Naive UI locally -->
    <script src="vue.global.js?v=20260618_1"></script>
    <script src="naive-ui.js?v=20260618_1"></script>
    <script src="app.js?v=20260619_2"></script>
</body>
</html>
